<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизация — Булочная</title>
    <!-- Путь к CSS тоже лучше сделать абсолютным от корня -->
    <link rel="stylesheet" href="css/style_login.css" />
  </head>
  <body>
    <div class="login-card">
      <h1>Вход в систему</h1>
      <!-- ВАЖНО: добавлен onsubmit="handleLogin(event)" -->
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Логин (кассир)</label>
          <input type="text" id="username" placeholder="Например: admin" required />
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" placeholder="Пароль" required />
        </div>
        <button type="submit">Войти</button>
      </form>
      <div id="message" class="message"></div>
    </div>

    <script src="/js/login.js" defer></script>
  </body>
</html>
